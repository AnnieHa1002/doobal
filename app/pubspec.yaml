name: doobal
description: "두발: 여행하는 예술가 — 걸은 만큼 화가가 명소로 여행하는 걷기·러닝 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  health: ^13.3.2
  rive: ^0.14.11
  app_settings: ^9.0.1
  share_plus: ^13.3.1
  pedometer: ^4.2.0
  flutter_local_notifications: ^22.3.3
  # 알림 예약(zonedSchedule)이 받는 시각 타입(TZDateTime). flutter_local_notifications가 이미 쓰는 판이라
  # 새로 들어오는 코드는 없다
  timezone: ^0.11.2
  workmanager: ^0.10.10
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_app_check: ^0.5.1
  google_sign_in: ^7.2.0
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # 정적 데이터 JSON (data/build_static.py 로 생성, config.json·events.json 문구는 손으로 고침)
  assets:
    - assets/data/
    - assets/data/themes/
    # Rive 시험 파일 (Drive 두발/rive_test_v01.riv 사본)
    - assets/rive/
    # 지도 경계 SVG와 위경도 투영 (Drive Assets 폴더의 ui_map_*_v01)
    - assets/map/
    # 승인된 v10 후경·v11 배경 원화
    - assets/backgrounds/v11/
    # 명소 풍경화 추천101장 (최종 채택 전 검토본)
    - assets/paintings/
    - assets/items/basic_v02/
    # 칸 그림(소품·상품 아이콘). 파일만 넣으면 칸이 찾는다 (domain/asset_index.dart)
    - assets/items/icons/
    # 배 9척 (boats.json assetDir). 동행 Rive 밖 그림(이야기 6장 등)
    - assets/boats/v01fix/
    - assets/companions/
    - assets/ui/

  # 앱 글꼴 Noto Sans KR 하나(11/12 Annie, SIL OFL 1.1). 가변 글꼴에서 굵기 3종을 뽑아 자주 쓰는 글자만
  # 남긴 판이다 (tools/subset_fonts.py). 원본은 Google Fonts(google/fonts ofl/notosanskr)
  fonts:
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
