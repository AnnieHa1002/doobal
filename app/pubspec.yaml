name: doobal
description: "두발: 여행하는 예술가 — 걸은 만큼 화가가 명소로 여행하는 걷기·러닝 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  health: ^13.3.2
  rive: ^0.14.11
  app_settings: ^9.0.1
  share_plus: ^13.3.1
  korean_profanity_filter: ^1.0.0
  pedometer: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # 정적 데이터 JSON (data/build_static.py 로 생성, config.json·events.json 문구는 손으로 고침)
  assets:
    - assets/data/
    - assets/data/themes/
    # Rive 시험 파일 (Drive 두발/rive_test_v01.riv 사본)
    - assets/rive/
    # 지도 경계 SVG와 위경도 투영 (Drive Assets 폴더의 ui_map_*_v01)
    - assets/map/

  # 고운바탕(제목·카드 제목·큰 숫자)·고운돋움(본문), SIL OFL 1.1.
  # 자주 쓰는 글자만 남긴 판이다. 원본은 Drive Assets/05_UI_화면/fonts, 다시 만들기는 tools/subset_fonts.py
  fonts:
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Regular.ttf
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
