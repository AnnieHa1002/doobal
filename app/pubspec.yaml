name: doobal
description: "두발: 여행하는 예술가 — 걸은 만큼 화가가 명소로 여행하는 걷기·러닝 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  health: ^13.3.2
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # 정적 데이터 JSON (data/build_static.py 로 생성, config.json·events.json 문구는 손으로 고침)
  assets:
    - assets/data/
    - assets/data/themes/
